compute_environment: LOCAL_MACHINE
debug: false
distributed_type: MULTI_GPU
downcast_bf16: 'no'
gpu_ids: all
mixed_precision: bf16

# --- 关键修改区域开始 ---
main_process_port: 29500  # 通信端口
rdzv_backend: c10d        # 多机通信后端，推荐使用 c10d
same_network: true
# --- 关键修改区域结束 ---

# 下面这些保持默认即可
enable_cpu_affinity: true
main_training_function: main
rdzv_backend: static
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false